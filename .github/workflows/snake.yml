name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # 每日 UTC 0:00 运行
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake svg (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6d28d9&color_dots=#ebedf0,#ddd3f8,#b9a5ef,#8f6fe0,#5f3dc4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2b2150,#452a85,#6d3fd1,#9d6ff0

      - name: Commit snake svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
