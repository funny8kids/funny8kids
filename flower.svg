<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中文艺术字体：毛笔行书 + 龙藏行草 -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Long+Cang&amp;display=swap');
      .title-art { font-family: 'Ma Shan Zheng','华文行楷','STXingkai','行楷','Long Cang',cursive,serif; }
    </style>

    <!-- 淡紫背景 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0"/>
    </radialGradient>

    <!-- 标题渐变 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- ========== 优雅紫罗兰花瓣（不对称、有遮挡、微卷边、柔和光泽） ========== -->
    <!-- 单片花瓣：修长水滴形，顶部圆钝底部尖，带柔和渐变和高光，边缘微卷 -->
    <radialGradient id="petalFill" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f3e8ff"/>
      <stop offset="75%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </radialGradient>
    <radialGradient id="petalFillDeep" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- 优雅单片花瓣（左偏，自然不对称） -->
    <g id="petalL">
      <path d="M0,0 C-5,-4 -10,-12 -8,-22 C-6,-29 -2,-31 0,-31 C2,-30 4,-27 5,-22 C7,-12 4,-4 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.4" stroke-opacity="0.45"/>
      <!-- 边缘微卷高光 -->
      <path d="M-1,-30 C-3,-26 -4,-20 -3,-14" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.7" stroke-linecap="round"/>
      <!-- 中心柔和光泽 -->
      <ellipse cx="-1" cy="-20" rx="2" ry="7" fill="#ffffff" opacity="0.45" transform="rotate(8 -1 -20)"/>
    </g>
    <!-- 右偏花瓣 -->
    <g id="petalR">
      <path d="M0,0 C5,-4 10,-12 8,-22 C6,-29 2,-31 0,-31 C-2,-30 -4,-27 -5,-22 C-7,-12 -4,-4 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.4" stroke-opacity="0.45"/>
      <path d="M1,-30 C3,-26 4,-20 3,-14" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.7" stroke-linecap="round"/>
      <ellipse cx="1" cy="-20" rx="2" ry="7" fill="#ffffff" opacity="0.45" transform="rotate(-8 1 -20)"/>
    </g>
    <!-- 中央花瓣（圆润柔和，无垂直叶脉） -->
    <g id="petalC">
      <path d="M0,2 C-6,-3 -11,-12 -9,-22 C-7,-29 -3,-31 0,-31 C3,-30 7,-28 9,-22 C11,-12 6,-3 0,2 Z"
            fill="url(#petalFillDeep)" stroke="#7c3aed" stroke-width="0.4" stroke-opacity="0.5"/>
      <path d="M-1,-30 C-3,-26 -4,-19 -3,-13" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.6" stroke-linecap="round"/>
      <ellipse cx="-1" cy="-19" rx="1.8" ry="6" fill="#ffffff" opacity="0.35" transform="rotate(6 -1 -19)"/>
    </g>

    <!-- ========== 完整紫罗兰：五瓣真正均匀放射（每瓣 72°，同尺寸，无主导瓣） ========== -->
    <g id="violetElegant">
      <!-- 五瓣绕中心均匀放射，略微错位避免机械感 -->
      <g transform="rotate(0) scale(0.98)"><use href="#petalL"/></g>
      <g transform="rotate(72) scale(1.0)"><use href="#petalR"/></g>
      <g transform="rotate(144) scale(0.97)"><use href="#petalL"/></g>
      <g transform="rotate(216) scale(1.0)"><use href="#petalR"/></g>
      <g transform="rotate(288) scale(0.98)"><use href="#petalL"/></g>
      <!-- 花心 -->
      <ellipse rx="2.2" ry="1.3" fill="#fde68a" opacity="0.9"/>
      <circle r="0.8" fill="#fff7cc" opacity="0.95"/>
    </g>

    <!-- 阴影 -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7c3aed" flood-opacity="0.28"/>
    </filter>
    <filter id="petalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.32"/>
    </filter>

    <!-- 飘落单瓣 -->
    <g id="fallPetal">
      <path d="M0,0 C-3,-2.5 -6,-8 -5,-15 C-3.5,-20 -1.5,-21 0,-21 C1.5,-20 3.5,-18 5,-15 C6,-8 3,-2.5 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.3" stroke-opacity="0.4"/>
      <path d="M-0.5,-20 C-2,-17 -2.8,-13 -2,-9" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#bgGlow)"/>

  <!-- 远景飘落花瓣 -->
  <g opacity="0.6" filter="url(#petalShadow)">
    <use href="#fallPetal" transform="translate(115,35) rotate(20) scale(0.8)">
      <animateTransform attributeName="transform" type="rotate" from="20" to="200" dur="15s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fallPetal" transform="translate(685,155) rotate(-15) scale(0.7)">
      <animateTransform attributeName="transform" type="rotate" from="-15" to="-195" dur="17s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fallPetal" transform="translate(725,45) rotate(50) scale(0.6)"/>
    <use href="#fallPetal" transform="translate(75,170) rotate(-30) scale(0.65)"/>
  </g>

  <!-- 中景飘落花瓣（围绕标题） -->
  <g filter="url(#petalShadow)">
    <use href="#fallPetal" transform="translate(58,55) rotate(30) scale(1.15)" opacity="0.92">
      <animateTransform attributeName="transform" type="rotate" from="30" to="210" dur="10s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fallPetal" transform="translate(742,58) rotate(-25) scale(1.1)" opacity="0.92">
      <animateTransform attributeName="transform" type="rotate" from="-25" to="-205" dur="12s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fallPetal" transform="translate(95,158) rotate(15) scale(1.0)" opacity="0.88"/>
    <use href="#fallPetal" transform="translate(705,152) rotate(-40) scale(1.05)" opacity="0.9"/>
  </g>

  <!-- 两朵优雅紫罗兰（标题两侧） -->
  <g transform="translate(120,102) scale(2.4)" filter="url(#petalShadow)">
    <use href="#violetElegant"/>
  </g>
  <g transform="translate(680,102) scale(2.4)" filter="url(#petalShadow)">
    <g transform="scale(-1,1)"><use href="#violetElegant"/></g>
  </g>

  <!-- ========== 艺术字主标题（毛笔行书） ========== -->
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="76" letter-spacing="10"
        fill="none" stroke="url(#strokeGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.7">紫罗兰手札</text>
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="76" letter-spacing="10"
        fill="url(#titleGrad)" filter="url(#softShadow)">紫罗兰手札</text>

  <!-- 副标：优雅衬线斜体（与中文气质统一） -->
  <text x="400" y="172" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif"
        font-style="italic" font-size="20" letter-spacing="4"
        fill="#7c3aed" opacity="0.88">Violet Notes</text>
  <line x1="300" y1="170" x2="340" y2="170" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <line x1="460" y1="170" x2="500" y2="170" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
</svg>
