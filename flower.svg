<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f0ff"/>
      <stop offset="50%" stop-color="#eadbff"/>
      <stop offset="100%" stop-color="#dbc3f9"/>
    </linearGradient>

    <!-- 标题渐变填充（深紫 → 亮紫 → 桃紫） -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- 光晕渐变（用于发光层） -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- 花瓣渐变 -->
    <linearGradient id="petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cba8ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="petalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b18aff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7e8bd"/>
      <stop offset="100%" stop-color="#4caf7d"/>
    </linearGradient>

    <!-- 书法装饰笔画渐变 -->
    <linearGradient id="vine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="vineDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- 五瓣花 -->
    <g id="flower">
      <g fill="url(#petal)">
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#ffd166"/>
      <circle r="1.2" fill="#fff7d6" opacity="0.9"/>
    </g>
    <g id="flowerDark">
      <g fill="url(#petalDark)">
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6.5" rx="4.2" ry="8.5" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#ffc94d"/>
      <circle r="1.2" fill="#fff3c4" opacity="0.9"/>
    </g>
    <!-- 叶片 -->
    <g id="leafSprig">
      <path d="M0,0 C7,-3.5 11,-1.5 15,6 C9,7.5 3.5,6.5 0,0 Z" fill="url(#leaf)"/>
      <path d="M1,1 C5.5,0 9.5,2 13,5" stroke="#2e9e5f" stroke-width="0.7" fill="none" opacity="0.5"/>
    </g>
    <!-- 星光 -->
    <g id="sparkle">
      <path d="M0,-7 C0.8,-2.5 2.5,-0.8 7,0 C2.5,0.8 0.8,2.5 0,7 C-0.8,2.5 -2.5,0.8 -7,0 C-2.5,-0.8 -0.8,-2.5 0,-7 Z" fill="#fbbf24" opacity="0.9"/>
    </g>
    <g id="sparkleSoft">
      <path d="M0,-5 C0.6,-1.8 1.8,-0.6 5,0 C1.8,0.6 0.6,1.8 0,5 C-0.6,1.8 -1.8,0.6 -5,0 C-1.8,-0.6 -0.6,-1.8 0,-5 Z" fill="#ffffff" opacity="0.88"/>
    </g>
    <g id="miniPetal">
      <ellipse rx="3" ry="5.5" fill="url(#petal)" opacity="0.5"/>
    </g>

    <!-- 光晕滤镜 -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5b21b6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- 柔和光晕 -->
  <circle cx="700" cy="28" r="60" fill="#ffffff" opacity="0.28"/>
  <circle cx="92" cy="176" r="46" fill="#ffffff" opacity="0.22"/>
  <circle cx="400" cy="-20" r="80" fill="#cba6ff" opacity="0.22"/>
  <circle cx="760" cy="172" r="34" fill="#cba6ff" opacity="0.28"/>

  <!-- 内框 -->
  <rect x="14" y="14" width="772" height="172" rx="26" fill="none" stroke="#b79bff" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="20" y="20" width="760" height="160" rx="20" fill="none" stroke="#d9c6ff" stroke-opacity="0.5" stroke-width="0.8"/>

  <!-- ================================================================ -->
  <!-- 书法装饰笔画（飘带/花藤，营造手写书法氛围）                      -->
  <!-- ================================================================ -->

  <!-- 主飘带（标题下方蜿蜒穿过） -->
  <path d="M100,116 C180,100 260,120 340,105 C380,98 420,102 460,105 C540,120 620,100 700,116"
        stroke="url(#vine)" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- 上方装饰弧线 -->
  <path d="M180,52 C240,38 300,62 360,48 C380,44 420,44 440,48 C500,62 560,38 620,52"
        stroke="url(#vineDark)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- 左侧花藤分支 -->
  <path d="M72,80 C68,68 78,56 92,50" stroke="url(#vine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M92,50 C98,44 108,46 104,54" fill="url(#leaf)" opacity="0.65"/>
  <path d="M82,70 C76,62 82,54 90,52" fill="url(#leaf)" opacity="0.6"/>

  <!-- 右侧花藤分支 -->
  <path d="M728,80 C732,68 722,56 708,50" stroke="url(#vine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M708,50 C702,44 692,46 696,54" fill="url(#leaf)" opacity="0.65"/>
  <path d="M718,70 C724,62 718,54 710,52" fill="url(#leaf)" opacity="0.6"/>

  <!-- 左下花藤 -->
  <path d="M88,140 C96,150 110,156 126,152" stroke="url(#vine)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M126,152 C130,146 126,140 120,142" fill="url(#leaf)" opacity="0.6"/>

  <!-- 右下花藤 -->
  <path d="M712,140 C704,150 690,156 674,152" stroke="url(#vine)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M674,152 C670,146 674,140 680,142" fill="url(#leaf)" opacity="0.6"/>

  <!-- 枯笔飞白效果（标题区域的半透明细线） -->
  <g opacity="0.25" stroke="#6d28d9" fill="none" stroke-linecap="round">
    <path d="M180,62 C250,54 320,58 400,56" stroke-width="0.5"/>
    <path d="M400,56 C480,58 550,54 620,62" stroke-width="0.5"/>
    <path d="M220,110 C300,104 370,108 400,107" stroke-width="0.4"/>
    <path d="M400,107 C430,108 500,104 580,110" stroke-width="0.4"/>
  </g>

  <!-- ================================================================ -->
  <!-- 标题「紫罗兰手札」                                                -->
  <!-- 层次：光晕层 → 描边层 → 渐变填充主字层                            -->
  <!-- ================================================================ -->

  <!-- 光晕层（紫光弥散效果） -->
  <text x="400" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Noto Serif CJK SC','Songti SC','STSong','SimSun','宋体',serif"
        font-size="68" font-weight="900" letter-spacing="12"
        fill="#a78bfa" opacity="0.25" filter="url(#textGlow)">紫罗兰手札</text>

  <!-- 描边层（字形轮廓） -->
  <text x="400" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Noto Serif CJK SC','Songti SC','STSong','SimSun','宋体',serif"
        font-size="68" font-weight="900" letter-spacing="12"
        fill="none" stroke="#3b0764" stroke-width="1.2" stroke-opacity="0.3">紫罗兰手札</text>

  <!-- 主字层（渐变填充 + 阴影） -->
  <text x="400" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC','Source Han Serif SC','Noto Serif CJK SC','Songti SC','STSong','SimSun','宋体',serif"
        font-size="68" font-weight="900" letter-spacing="12"
        fill="url(#titleGrad)" filter="url(#softShadow)">紫罗兰手札</text>

  <!-- ================================================================ -->
  <!-- 副标题 "Violet Notes"                                             -->
  <!-- ================================================================ -->

  <!-- 装饰线 -->
  <line x1="235" y1="149" x2="308" y2="149" stroke="#b79bff" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="231" cy="149" r="2.2" fill="#a78bfa" opacity="0.9"/>
  <line x1="492" y1="149" x2="565" y2="149" stroke="#b79bff" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="569" cy="149" r="2.2" fill="#a78bfa" opacity="0.9"/>

  <!-- 副标题文字 -->
  <text x="400" y="155" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif"
        font-style="italic" font-size="18" letter-spacing="4"
        fill="url(#subGrad)">Violet Notes</text>

  <!-- ================================================================ -->
  <!-- 四角花簇                                                          -->
  <!-- ================================================================ -->

  <!-- 左上 -->
  <g transform="translate(60,54)">
    <use href="#leafSprig" transform="translate(10,6) rotate(-20)"/>
    <use href="#flower"/>
    <use href="#flower" transform="translate(28,20) rotate(12) scale(0.6)"/>
    <use href="#flowerDark" transform="translate(-20,24) rotate(-10) scale(0.52)"/>
    <use href="#sparkleSoft" transform="translate(-28,-16) scale(0.85)"/>
  </g>
  <!-- 右上（镜像） -->
  <g transform="translate(740,54) scale(-1,1)">
    <use href="#leafSprig" transform="translate(10,6) rotate(-20)"/>
    <use href="#flower"/>
    <use href="#flower" transform="translate(28,20) rotate(12) scale(0.6)"/>
    <use href="#flowerDark" transform="translate(-20,24) rotate(-10) scale(0.52)"/>
    <use href="#sparkleSoft" transform="translate(-28,-16) scale(0.85)"/>
  </g>
  <!-- 左下 -->
  <g transform="translate(62,146) scale(0.82)">
    <use href="#leafSprig" transform="translate(10,6) rotate(-20)"/>
    <use href="#flower"/>
    <use href="#flower" transform="translate(26,18) rotate(10) scale(0.58)"/>
    <use href="#flowerDark" transform="translate(-18,22) rotate(-12) scale(0.5)"/>
  </g>
  <!-- 右下（镜像） -->
  <g transform="translate(738,146) scale(-0.82,0.82)">
    <use href="#leafSprig" transform="translate(10,6) rotate(-20)"/>
    <use href="#flower"/>
    <use href="#flower" transform="translate(26,18) rotate(10) scale(0.58)"/>
    <use href="#flowerDark" transform="translate(-18,22) rotate(-12) scale(0.5)"/>
  </g>

  <!-- 散落小花瓣 -->
  <use href="#miniPetal" transform="translate(200,38) rotate(25)"/>
  <use href="#miniPetal" transform="translate(600,35) rotate(-30)"/>
  <use href="#miniPetal" transform="translate(350,165) rotate(15)"/>
  <use href="#miniPetal" transform="translate(480,168) rotate(-20)"/>

  <!-- 点缀星光 -->
  <use href="#sparkle" transform="translate(190,105) scale(0.85)"/>
  <use href="#sparkle" transform="translate(610,105) scale(0.85)"/>
  <use href="#sparkleSoft" transform="translate(400,30) scale(0.55)"/>
  <use href="#sparkleSoft" transform="translate(330,42) scale(0.4)"/>
  <use href="#sparkleSoft" transform="translate(470,38) scale(0.45)"/>
</svg>
