<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      @font-face {
        font-family: 'MSZ';
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      
      .title-art { font-family: 'MSZ','Ma Shan Zheng','华文行楷','STXingkai','行楷',cursive,serif; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbff"/>
      <stop offset="55%" stop-color="#f6f1fc"/>
      <stop offset="100%" stop-color="#efe8fa"/>
    </linearGradient>
    <radialGradient id="glowL" cx="16%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#e6d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e6d8f8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="84%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#e6d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e6d8f8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="petalFill" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#fdfaff"/>
      <stop offset="32%" stop-color="#ead9f8"/>
      <stop offset="68%" stop-color="#c39ae4"/>
      <stop offset="100%" stop-color="#8b46c7"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab887"/>
      <stop offset="100%" stop-color="#4f7a52"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eecf8d"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>

    <!-- 单瓣 -->
    <g id="petal">
      <path d="M0,0 C-5,-4 -9,-12 -7.5,-21 C-6,-28 -2,-30 0,-30 C2,-30 6,-28 7.5,-21 C9,-12 5,-4 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.35" stroke-opacity="0.4"/>
      <path d="M-0.8,-29 C-2.8,-25 -3.6,-19 -2.6,-13" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.65" stroke-linecap="round"/>
    </g>
    <!-- 五瓣紫罗兰 -->
    <g id="violet">
      <g transform="rotate(0)"><use href="#petal"/></g>
      <g transform="rotate(72)"><use href="#petal"/></g>
      <g transform="rotate(144)"><use href="#petal"/></g>
      <g transform="rotate(216)"><use href="#petal"/></g>
      <g transform="rotate(288)"><use href="#petal"/></g>
      <ellipse rx="2.1" ry="1.25" fill="#fde68a" opacity="0.92"/>
      <circle r="0.75" fill="#fff7cc" opacity="0.95"/>
    </g>
    <!-- 叶子 -->
    <g id="leaf">
      <path d="M0,0 C-7,-2 -13,-8 -14,-18 C-6,-16 -1,-9 0,0 Z" fill="url(#leafGrad)" opacity="0.9"/>
      <path d="M-1,-2 C-5,-6 -9,-11 -12,-16" stroke="#3d6240" stroke-width="0.5" fill="none" opacity="0.55"/>
    </g>
    <!-- 飘落花瓣 -->
    <g id="fallPetal">
      <path d="M0,0 C-3,-2.5 -6,-8 -5,-15 C-3.5,-20 -1.5,-21 0,-21 C1.5,-20 3.5,-18 5,-15 C6,-8 3,-2.5 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.3" stroke-opacity="0.38"/>
    </g>
    <!-- 星光 -->
    <g id="sparkle">
      <path d="M0,-4.5 C0.6,-1.3 1.3,-0.6 4.5,0 C1.3,0.6 0.6,1.3 0,4.5 C-0.6,1.3 -1.3,0.6 -4.5,0 C-1.3,-0.6 -0.6,-1.3 0,-4.5 Z" fill="#f3dd9a"/>
    </g>
    <!-- 角花 -->
    <g id="corner" fill="none" stroke="#b79ae0" stroke-width="1" stroke-linecap="round">
      <path d="M0,14 C0,6 6,0 14,0"/>
      <path d="M0,22 C0,10 10,0 22,0" opacity="0.5"/>
      <circle cx="5" cy="5" r="1.4" fill="#b79ae0" stroke="none"/>
    </g>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <filter id="petalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- 左侧花束（右侧镜像复用） -->
    <g id="bouquet">
      <path d="M0,52 C-4,30 -2,10 -14,-16" stroke="#5d8a60" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M0,52 C2,34 8,16 4,-8" stroke="#5d8a60" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M0,52 C-8,40 -14,30 -26,16" stroke="#5d8a60" stroke-width="1" fill="none" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(-3,38) scale(1.15)"/>
      <use href="#leaf" transform="translate(2,26) scale(-1.0,1.0) rotate(12)"/>
      <use href="#leaf" transform="translate(-8,14) scale(0.85) rotate(-10)"/>
      <use href="#violet" transform="translate(-14,-20) scale(1.35)" filter="url(#petalShadow)"/>
      <use href="#violet" transform="translate(5,-12) scale(0.95) rotate(24)" filter="url(#petalShadow)"/>
      <use href="#violet" transform="translate(-27,12) scale(0.75) rotate(-18)" filter="url(#petalShadow)"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="240" fill="url(#bg)"/>
  <rect width="800" height="240" fill="url(#glowL)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="800" height="240" fill="url(#glowR)">
    <animate attributeName="opacity" values="1;0.7;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="800" height="240" fill="url(#centerGlow)"/>

  <!-- 细双线框 -->
  <rect x="10.5" y="10.5" width="779" height="219" rx="7" fill="none" stroke="#cdb9ec" stroke-width="1"/>
  <rect x="16.5" y="16.5" width="767" height="207" rx="5" fill="none" stroke="#e0d3f4" stroke-width="0.7"/>
  <use href="#corner" transform="translate(24,24)"/>
  <use href="#corner" transform="translate(776,24) scale(-1,1)"/>
  <use href="#corner" transform="translate(24,216) scale(1,-1)"/>
  <use href="#corner" transform="translate(776,216) scale(-1,-1)"/>

  <!-- 飘落花瓣 -->
  <g filter="url(#petalShadow)">
    <g><use href="#fallPetal" transform="scale(0.6)">
      <animateTransform attributeName="transform" type="translate" values="150,-30; 190,260" dur="10s" repeatCount="indefinite"/></use>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="10s" repeatCount="indefinite"/></g>
    <g><use href="#fallPetal" transform="scale(0.75)">
      <animateTransform attributeName="transform" type="translate" values="330,-40; 300,260" dur="12s" begin="-4s" repeatCount="indefinite"/></use>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="-4s" repeatCount="indefinite"/></g>
    <g><use href="#fallPetal" transform="scale(0.55)">
      <animateTransform attributeName="transform" type="translate" values="500,-35; 540,260" dur="11s" begin="-7s" repeatCount="indefinite"/></use>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.9;1" dur="11s" begin="-7s" repeatCount="indefinite"/></g>
    <g><use href="#fallPetal" transform="scale(0.7)">
      <animateTransform attributeName="transform" type="translate" values="660,-30; 620,260" dur="9.5s" begin="-2s" repeatCount="indefinite"/></use>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="9.5s" begin="-2s" repeatCount="indefinite"/></g>
  </g>

  <!-- 星光 -->
  <g>
    <use href="#sparkle" transform="translate(215,52) scale(0.55)"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#sparkle" transform="translate(585,46) scale(0.5)"><animate attributeName="opacity" values="1;0.15;1" dur="3.6s" repeatCount="indefinite"/></use>
    <use href="#sparkle" transform="translate(400,36) scale(0.45)"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></use>
    <use href="#sparkle" transform="translate(268,196) scale(0.45)"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.9s" repeatCount="indefinite"/></use>
    <use href="#sparkle" transform="translate(540,192) scale(0.5)"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- 左右花束 -->
  <g transform="translate(96,128)">
    <use href="#bouquet">
      <animateTransform attributeName="transform" type="rotate" values="-2.5 0 52; 2.5 0 52; -2.5 0 52" dur="6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(704,128) scale(-1,1)">
    <use href="#bouquet">
      <animateTransform attributeName="transform" type="rotate" values="2.5 0 52; -2.5 0 52; 2.5 0 52" dur="6.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 主标题 -->
  <text x="400" y="106" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="62" letter-spacing="14" fill="#b79ae0" opacity="0.5" filter="url(#glow)">紫罗兰手札
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="106" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="62" letter-spacing="14" fill="none" stroke="url(#strokeGrad)" stroke-width="1.6" stroke-linejoin="round" opacity="0.65">紫罗兰手札</text>
  <text x="400" y="106" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="62" letter-spacing="14" fill="url(#titleGrad)" filter="url(#softShadow)">紫罗兰手札</text>

  <!-- 装饰分隔线 -->
  <g stroke="#c3ade8" stroke-width="1" stroke-linecap="round" opacity="0.85">
    <line x1="298" y1="146" x2="368" y2="146"/>
    <line x1="432" y1="146" x2="502" y2="146"/>
  </g>
  <g transform="translate(400,146)">
    <rect x="-4.2" y="-4.2" width="8.4" height="8.4" transform="rotate(45)" fill="url(#goldGrad)" filter="url(#petalShadow)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="286" cy="146" r="1.6" fill="#c3ade8"/>
  <circle cx="514" cy="146" r="1.6" fill="#c3ade8"/>

  <!-- 英文副标题 -->
  <text x="400" y="176" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif"
        font-size="17" letter-spacing="9" fill="#6d28d9" opacity="0.9">VIOLET NOTES</text>

  <!-- 中文签语 -->
  <text x="400" y="208" text-anchor="middle" class="title-art"
        font-size="16" letter-spacing="8" fill="#9a86c8" opacity="0.95">见字如晤 · 以信传心</text>
</svg>
