<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景：极淡紫渐变（高级留白） -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="55%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- 主标题渐变（深紫单色，克制） -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- 角落光晕 -->
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- 极简线条花（半透明勾勒，去描边廉价感） -->
    <linearGradient id="flowerLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 主标题微阴影（锐利可读，不糊字） -->
    <filter id="titleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4c1d95" flood-opacity="0.22"/>
    </filter>

    <!-- 极简五瓣线框花 -->
    <g id="lineFlower">
      <g fill="none" stroke="url(#flowerLine)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0,-2 C-3,-8 -3,-13 0,-16 C3,-13 3,-8 0,-2 Z"/>
        <path d="M0,-2 C-3,-8 -3,-13 0,-16 C3,-13 3,-8 0,-2 Z" transform="rotate(72)"/>
        <path d="M0,-2 C-3,-8 -3,-13 0,-16 C3,-13 3,-8 0,-2 Z" transform="rotate(144)"/>
        <path d="M0,-2 C-3,-8 -3,-13 0,-16 C3,-13 3,-8 0,-2 Z" transform="rotate(216)"/>
        <path d="M0,-2 C-3,-8 -3,-13 0,-16 C3,-13 3,-8 0,-2 Z" transform="rotate(288)"/>
      </g>
      <circle r="2.2" fill="#a78bfa" opacity="0.7"/>
    </g>

    <!-- 极简细藤蔓 -->
    <linearGradient id="vine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景：纯净单色渐变，无光斑 -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- 内框：极细双线，克制 -->
  <rect x="16" y="16" width="768" height="168" rx="20" fill="none" stroke="#c4b5fd" stroke-opacity="0.45" stroke-width="1"/>

  <!-- 上方英文副标（字母大间距，避开装饰线；加深对比度） -->
  <text x="400" y="64" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="14"
        fill="#6d28d9">VIOLET NOTES</text>

  <!-- 副标两侧极细装饰短线（缩短，增加留白呼吸感） -->
  <line x1="268" y1="61" x2="300" y2="61" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="500" y1="61" x2="532" y2="61" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- 主标题「紫罗兰手札」（纯净渐变填充，无任何滤镜，文字绝对锐利） -->
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central"
        font-family="'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','SimSun','宋体',serif"
        font-size="56" font-weight="700" letter-spacing="20"
        fill="url(#titleGrad)">紫罗兰手札</text>

  <!-- 标题下方居中点缀：极细渐隐线 + 中心小圆点 -->
  <line x1="270" y1="156" x2="380" y2="156" stroke="url(#vine)" stroke-width="1"/>
  <line x1="420" y1="156" x2="530" y2="156" stroke="url(#vine)" stroke-width="1"/>
  <circle cx="400" cy="156" r="2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="268" cy="156" r="1.6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="532" cy="156" r="1.6" fill="#a78bfa" opacity="0.6"/>

  <!-- 角落花朵暗纹：极低透明度作为背景纹理呼应主题，不与文字争抢视觉 -->
  <g transform="translate(70,168) scale(2.4)" opacity="0.13">
    <use href="#lineFlower"/>
  </g>
  <g transform="translate(730,32) scale(2.4)" opacity="0.13">
    <g transform="scale(-1,1)"><use href="#lineFlower"/></g>
  </g>
</svg>
