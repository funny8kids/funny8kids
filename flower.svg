<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 内嵌艺术字体（base64 woff2，确保 GitHub 上也能渲染毛笔行书） -->
    <style type="text/css">
      @font-face {
        font-family: 'MSZ';
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .title-art { font-family: 'MSZ','Ma Shan Zheng','华文行楷','STXingkai','行楷',cursive,serif; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="petalFill" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f3e8ff"/>
      <stop offset="75%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </radialGradient>

    <g id="petalL">
      <path d="M0,0 C-5,-4 -10,-12 -8,-22 C-6,-29 -2,-31 0,-31 C2,-30 4,-27 5,-22 C7,-12 4,-4 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.4" stroke-opacity="0.45"/>
      <path d="M-1,-30 C-3,-26 -4,-20 -3,-14" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.7" stroke-linecap="round"/>
      <ellipse cx="-1" cy="-20" rx="2" ry="7" fill="#ffffff" opacity="0.45" transform="rotate(8 -1 -20)"/>
    </g>
    <g id="petalR">
      <path d="M0,0 C5,-4 10,-12 8,-22 C6,-29 2,-31 0,-31 C-2,-30 -4,-27 -5,-22 C-7,-12 -4,-4 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.4" stroke-opacity="0.45"/>
      <path d="M1,-30 C3,-26 4,-20 3,-14" stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.7" stroke-linecap="round"/>
      <ellipse cx="1" cy="-20" rx="2" ry="7" fill="#ffffff" opacity="0.45" transform="rotate(-8 1 -20)"/>
    </g>

    <g id="violetElegant">
      <g transform="rotate(0) scale(0.98)"><use href="#petalL"/></g>
      <g transform="rotate(72) scale(1.0)"><use href="#petalR"/></g>
      <g transform="rotate(144) scale(0.97)"><use href="#petalL"/></g>
      <g transform="rotate(216) scale(1.0)"><use href="#petalR"/></g>
      <g transform="rotate(288) scale(0.98)"><use href="#petalL"/></g>
      <ellipse rx="2.2" ry="1.3" fill="#fde68a" opacity="0.9"/>
      <circle r="0.8" fill="#fff7cc" opacity="0.95"/>
    </g>

    <g id="fallPetal">
      <path d="M0,0 C-3,-2.5 -6,-8 -5,-15 C-3.5,-20 -1.5,-21 0,-21 C1.5,-20 3.5,-18 5,-15 C6,-8 3,-2.5 0,0 Z"
            fill="url(#petalFill)" stroke="#a855f7" stroke-width="0.3" stroke-opacity="0.4"/>
      <path d="M-0.5,-20 C-2,-17 -2.8,-13 -2,-9" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>

    <g id="sparkle">
      <path d="M0,-5 C0.7,-1.5 1.5,-0.7 5,0 C1.5,0.7 0.7,1.5 0,5 C-0.7,1.5 -1.5,0.7 -5,0 C-1.5,-0.7 -0.7,-1.5 0,-5 Z" fill="#fef9c3"/>
    </g>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7c3aed" flood-opacity="0.28"/>
    </filter>
    <filter id="petalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景 + 脉动光晕 -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#bgGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ========== 持续飘落花瓣（带飘移轨迹 + 旋转） ========== -->
  <g filter="url(#petalShadow)">
    <g>
      <use href="#fallPetal" transform="scale(0.7)">
        <animateTransform attributeName="transform" type="translate" values="60,-30; 120,230" dur="9s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#fallPetal" transform="scale(0.85)">
        <animateTransform attributeName="transform" type="translate" values="220,-40; 180,230" dur="11s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#fallPetal" transform="scale(0.65)">
        <animateTransform attributeName="transform" type="translate" values="420,-50; 460,230" dur="10s" begin="-3s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="10s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#fallPetal" transform="scale(0.75)">
        <animateTransform attributeName="transform" type="translate" values="600,-30; 560,230" dur="12s" begin="-6s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#fallPetal" transform="scale(0.7)">
        <animateTransform attributeName="transform" type="translate" values="740,-40; 700,230" dur="10s" begin="-2s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="10s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#fallPetal" transform="scale(0.55)">
        <animateTransform attributeName="transform" type="translate" values="320,-40; 360,230" dur="13s" begin="-8s" repeatCount="indefinite"/>
      </use>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.9;1" dur="13s" begin="-8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 闪烁星光 -->
  <g>
    <use href="#sparkle" transform="translate(180,40) scale(0.6)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" transform="translate(620,35) scale(0.5)">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" transform="translate(400,30) scale(0.5)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" transform="translate(560,170) scale(0.45)">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" transform="translate(250,165) scale(0.5)">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 两侧紫罗兰（带轻微摇曳） -->
  <g transform="translate(120,102)">
    <g filter="url(#petalShadow)">
      <use href="#violetElegant" transform="scale(2.4)">
        <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="5s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>
  <g transform="translate(680,102)">
    <g filter="url(#petalShadow)">
      <use href="#violetElegant" transform="scale(2.4)">
        <animateTransform attributeName="transform" type="rotate" values="4;-4;4" dur="5.5s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <!-- ========== 艺术字主标题（呼吸光晕） ========== -->
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="76" letter-spacing="10"
        fill="#c4b5fd" opacity="0.55" filter="url(#glow)">紫罗兰手札
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="76" letter-spacing="10"
        fill="none" stroke="url(#strokeGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.7">紫罗兰手札</text>
  <text x="400" y="124" text-anchor="middle" dominant-baseline="central" class="title-art"
        font-size="76" letter-spacing="10"
        fill="url(#titleGrad)" filter="url(#softShadow)">紫罗兰手札</text>

  <text x="400" y="172" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif"
        font-style="italic" font-size="20" letter-spacing="4"
        fill="#7c3aed" opacity="0.88">Violet Notes</text>
  <line x1="300" y1="170" x2="340" y2="170" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <line x1="460" y1="170" x2="500" y2="170" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
</svg>
